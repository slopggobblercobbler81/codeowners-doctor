name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Run test suite with pytest
        run: |
          pytest -v --cov=codeowners_doctor

      - name: Verify CLI execution
        run: |
          codeowners-doctor --version
          codeowners-doctor --help
          codeowners-doctor init --out test_codeowners --default-owner @org/core
          codeowners-doctor check test_codeowners
          codeowners-doctor who README.md --file test_codeowners
          codeowners-doctor format test_codeowners
